name: CI - Detection Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/detection-service/**'
      - '.github/workflows/ci-detection-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/detection-service/**'
      - '.github/workflows/ci-detection-service.yml'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd services/detection-service
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pytest pytest-cov pytest-asyncio httpx

      - name: Lint with Ruff
        run: |
          cd services/detection-service
          ruff check src

      - name: Run tests if present
        run: |
          cd services/detection-service
          if [ -d tests ]; then
            pytest --cov=src --cov-report=term-missing
          else
            echo "No tests directory for detection-service"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/detection-service
          push: false
          tags: detection-service:latest