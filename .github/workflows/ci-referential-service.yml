name: CI - Referential Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/referential-service/**'
      - '.github/workflows/ci-referential-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/referential-service/**'
      - '.github/workflows/ci-referential-service.yml'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd services/referential-service
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pytest pytest-cov pytest-asyncio httpx

      - name: Lint with Ruff
        run: |
          cd services/referential-service
          ruff check app

      - name: Run tests if present
        run: |
          cd services/referential-service
          if [ -d tests ]; then
            pytest --cov=app --cov-report=term-missing
          else
            echo "No tests directory for referential-service"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/referential-service
          push: false
          tags: referential-service:latest