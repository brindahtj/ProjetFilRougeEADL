[project]
name = "projetfilrougeeadl"
version = "0.1.0"
description = "Projet Smart City IoT"
authors = [
    {name = "A"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "pika (>=1.4.1,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "mkdocstrings (>=1.0.6,<2.0.0)",
    "mkdocstrings-python (>=2.0.5,<3.0.0)"
]

[tool.poetry]
package-mode = false