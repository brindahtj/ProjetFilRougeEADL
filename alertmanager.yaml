global:
  scrape_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'urbanhub-api'
    static_configs:
      - targets: ['api:8000'] # Remplacez par le nom/port de votre service API

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']