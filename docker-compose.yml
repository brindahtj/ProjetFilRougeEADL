services:
  postgres:
    image: postgres:16
    container_name: urbanhub_postgres
    environment:
      POSTGRES_DB: urbanhub
      POSTGRES_USER: urbanhub_user
      POSTGRES_PASSWORD: urbanhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanhub_user -d urbanhub"]
      interval: 10s
      timeout: 5s
      retries: 5




  simulator:
    build: ./sensor-simulator
    container_name: urbanhub_simulator
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      TARGET_API_URL: ${TARGET_API_URL}
      MEASUREMENTS_PER_SECOND: ${MEASUREMENTS_PER_SECOND}

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: urbanhub_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@urbanhub.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  referential:
    build:
      context: ./services/referential-service
      dockerfile: Dockerfile
    container_name: referential_service
    ports:
      - "8001:8001"
    environment:
      POSTGRES_HOST: postgres
      TARGET_API_URL: ${TARGET_API_URL}
      MEASUREMENTS_PER_SECOND: ${MEASUREMENTS_PER_SECOND}
    depends_on:
      postgres:
        condition: service_healthy

  notification:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification_service
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      TARGET_API_URL: ${TARGET_API_URL}
      MEASUREMENTS_PER_SECOND: ${MEASUREMENTS_PER_SECOND}


  ingestion:
    build:
      context: ./services/ingestion-service
      dockerfile: Dockerfile
    environment:
      VALIDATION_SERVICE_URL: http://validation:8002
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      TARGET_API_URL: ${TARGET_API_URL}
      MEASUREMENTS_PER_SECOND: ${MEASUREMENTS_PER_SECOND}
    ports:
      - "8000:8000"
    depends_on:
      validation:
        condition: service_started

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  validation:
    build:
      context: ./services/validation-service
      dockerfile: Dockerfile
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      TARGET_API_URL: ${TARGET_API_URL}
      MEASUREMENTS_PER_SECOND: ${MEASUREMENTS_PER_SECOND}
    ports:
      - "8002:8002"

    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  association:
    build:
      context: ./services/association-service
      dockerfile: Dockerfile
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      TARGET_API_URL: ${TARGET_API_URL}
      MEASUREMENTS_PER_SECOND: ${MEASUREMENTS_PER_SECOND}
    command: python -m src.subcriber

  analyse:
    build:
      context: ./services/analyse-service
      dockerfile: Dockerfile
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      TARGET_API_URL: ${TARGET_API_URL}
      MEASUREMENTS_PER_SECOND: ${MEASUREMENTS_PER_SECOND}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  detection:
    build:
      context: ./services/detection-service
      dockerfile: Dockerfile
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      TARGET_API_URL: ${TARGET_API_URL}
      MEASUREMENTS_PER_SECOND: ${MEASUREMENTS_PER_SECOND}
    depends_on:
      referential:
        condition: service_started
    command: python -m src.consumer

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisionning/alerting/alerting.yml:/etc/grafana/provisionning/alerting/alerting.yml
      - ./grafana/provisionning/alerting/alerts.yml:/etc/grafana/provisionning/alerting/alerts.yml
      - grafana-data:/var/lib/grafana


    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  postgres_data:
  grafana-data: