input {
  file {
    path => "/var/log/app/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  # Les logs sont déjà en JSON structuré (timestamp, level, logger, message)
  # écrits par ingestion-service. Rien à parser en plus ici.
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "urbanhub-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}